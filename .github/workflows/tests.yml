name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # CPU-only torch first: the default wheel pulls in ~2 GB of GPU libraries we never use
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-log.txt pytest

      - name: Run tests
        run: python -m pytest -v

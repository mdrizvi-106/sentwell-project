name: Log daily sentiment

on:
  schedule:
    # 21:15 UTC daily: after the US close in both summer and winter time.
    # Scheduled runs can start hours late; at 22:00 some ran past midnight
    # UTC and split one day's symbols across two dates (the script now also
    # fixes the run date once at the start).
    - cron: "15 21 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # lets the keepalive step commit

jobs:
  log-sentiment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-log.txt

      - name: Run sentiment logging script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/log_daily_sentiment.py

      - name: Keep schedule alive (commit if repo idle 30+ days)
        # GitHub disables scheduled workflows in public repos after 60 days
        # without commits (this happened on 4 Sep 2026). A tiny commit once
        # a month keeps the daily job running.
        if: always()   # keep alive even if today's news fetch failed
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((30*86400)) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/last_run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last_run.txt
            git commit -m "chore: keep scheduled workflow active"
            git push
          else
            echo "Repo active within 30 days, no keepalive commit needed."
          fi
